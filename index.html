<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de personajes — Rick and Morty</title>
  <link rel="stylesheet" href="src/styles/style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Buscador de <span>personajes</span></h1>
      <p>Datos en vivo desde la Rick and Mory API</p>
    </header>

    <button type="button" id="limpiar-filtros" class="boton">Limpiar flitros</button>

    <form class="filtros">
      <input type="text" id="filtro-nombre" placeholder="Buscar por nombre..." />
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
        <option value="alive">Vivo</option>
        <option value="dead">Muerto</option>
        <option value="unknown">Desconocido</option>
      </select>
      <select id="filtro-especie">
        <option value="">Todas las especies</option>
        <option value="Human">Humano</option>
        <option value="Alien">Alien</option>
      </select>
    </form>

    <div class="opciones">
      <button type="button" id="ordenar-nombre" class="boton" aria-pressed="false" >Ordenar A-Z</button>
      <label class="opcion-limite">
        <input type="checkbox" id="limitar-resultados" />Mostrar solo los primeros 10
      </label>
    </div>

    <p id="contador"></p>

    <section id="resultados" class="personajes-grid"></section>
  </main>

  <script src="src/js/app.js"></script>
</body>
</html>
